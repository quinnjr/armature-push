[package]
name = "armature-push"
version = "0.2.2"
edition = "2024"
rust-version = "1.94.1"
authors = ["Joseph Quinn <quinn.josephr@proton.me>"]
license = "Apache-2.0"
repository = "https://github.com/quinnjr/armature-push"
homepage = "https://quinnjr.github.io/armature"
description = "Push notifications for Armature - Web Push, FCM, and APNS"
keywords = ["push", "notifications", "fcm", "apns", "web-push"]
categories = ["web-programming", "asynchronous"]

[dependencies]
# Async runtime
tokio = { version = "1.53", features = ["sync", "time"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# HTTP client
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    "form",
    "rustls",
    "http2",
] }

# Error handling
thiserror = "2.0"

# Utilities
tracing = "0.1"
url = "2.5"
# `futures-util` rather than the `futures` facade: the only use is
# `stream::{self, StreamExt}`, and the facade additionally pulls in
# futures-executor/futures-channel/futures-sink for nothing.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
# Shared, refcounted request bodies so a batch send allocates and serializes
# one APNS payload instead of one per device token.
bytes = "1"

# Web Push (VAPID). We use web-push only to build the VAPID signature and
# the encrypted ECE payload; the notification is sent over our own reqwest
# (rustls) client. `default-features = false` drops web-push's default
# `isahc-client`, which pulled `isahc` → `curl-sys` → a vendored libcurl C
# build — so `features = ["web-push"]` no longer needs libcurl/libssl on the
# build host and stays pure-Rust/rustls like the rest of the workspace.
web-push = { version = "0.11", default-features = false, optional = true }

# JWT for FCM (RS256) and APNS (ES256). A crypto backend feature is required:
# without one, jsonwebtoken (10 and 11)'s `encode`/`decode` panic at runtime
# because no `CryptoProvider` can be auto-selected. `aws_lc_rs` rather than
# `rust_crypto`: the latter pulls the `rsa` crate, whose RSA private-key
# operations are not constant-time (RUSTSEC-2023-0071, "Marvin"), and FCM signs
# with an RSA service-account key on every token refresh. aws-lc-rs is already
# the rustls backend used throughout the workspace, and matches armature-jwt
# and armature-auth.
jsonwebtoken = { version = "11.0", optional = true, default-features = false, features = ["use_pem", "aws_lc_rs"] }

# Shared SSRF guard (address classification) for Web Push endpoints.
armature-http-client = { version = "0.2", optional = true }

[dev-dependencies]
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "test-util"] }
armature-testkit = { path = "../armature-testkit" }
# Test keys are generated at test time (no committed private keys). aws-lc-rs
# is already in the graph via jsonwebtoken's `aws_lc_rs` backend.
aws-lc-rs = "1"
base64 = "0.22"

[features]
default = ["fcm"]
web-push = ["dep:web-push", "dep:armature-http-client"]
fcm = ["jsonwebtoken"]
apns = ["jsonwebtoken", "reqwest/http2"]
all = ["web-push", "fcm", "apns"]
